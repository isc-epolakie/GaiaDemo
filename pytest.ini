[pytest]
# Confine collection to tests/ so pytest does not crawl the IRIS container's
# durable/ tree, which contains a symlinked CSP file that crashes collection
# with a WinError on Windows.
testpaths = tests
addopts = -p no:cacheprovider
# Silence the pytest-asyncio default-loop-scope deprecation warning.
asyncio_default_fixture_loop_scope = function
