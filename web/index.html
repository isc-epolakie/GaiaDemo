<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaia Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04060c; --text:#e8edf6; --muted:#93a1b8;
    --line:rgba(150,180,220,.18); --panel:rgba(12,16,28,.62);
    --accent:#7aa2ff; --accent2:#ff7a94;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,system-ui,-apple-system,sans-serif;font-weight:400}
  canvas{display:block}
  #scene{position:fixed;inset:0;z-index:0}

  /* fixed overlays */
  #title{position:fixed;top:26px;left:32px;z-index:3;max-width:44ch;pointer-events:none;
    transition:opacity .45s ease}
  #title h1{margin:0;font-weight:300;font-size:24px;letter-spacing:8px;color:#fff}
  #title h1 b{font-weight:600}
  #title p{margin:8px 0 0;font-size:13px;line-height:1.55;color:var(--muted);letter-spacing:.2px;font-weight:300}

  #controls{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:4;
    display:flex;flex-direction:column;align-items:center;gap:14px;transition:opacity .45s ease}
  /* when scrolled into the data section, retract the fixed hero UI so nothing overlaps */
  body.at-data #title,body.at-data #controls{opacity:0;pointer-events:none}
  #dock{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;
    background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);
    box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #dock label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  #dock input{width:82px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:9px 11px;font-size:15px;outline:none;font-family:inherit}
  #dock input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,162,255,.18)}
  .btn{cursor:pointer;border:none;border-radius:10px;padding:10px 22px;font-weight:600;
    letter-spacing:.5px;font-size:13px;color:#06101f;font-family:inherit;
    background:linear-gradient(120deg,var(--accent),#a98bff);
    box-shadow:0 0 22px rgba(122,162,255,.4);transition:transform .12s,box-shadow .2s}
  .btn:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(122,162,255,.7)}
  #status{font-size:12px;color:var(--accent);letter-spacing:.3px;min-width:150px;text-align:center;height:14px}
  #status.err{color:#ff9aa2}
  #hint{font-size:11px;color:var(--muted);letter-spacing:.4px;opacity:.8}

  /* reveal-data affordance */
  #reveal{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
    background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;
    letter-spacing:2px;text-transform:uppercase;transition:color .2s}
  #reveal:hover{color:var(--text)}
  #reveal .chev{width:12px;height:12px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;
    transform:rotate(45deg);animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(3px,3px)}}

  /* page sections */
  #hero{height:100vh;pointer-events:none}
  #data{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;padding:96px 20px 90px;
    background:linear-gradient(180deg,rgba(4,6,12,0) 0%,rgba(4,6,12,.78) 22%,rgba(4,6,12,.92) 100%)}
  /* data-view control bar: Back-to-sky + a threshold query, sits above the panel */
  #databar{width:780px;max-width:calc(100vw - 40px);display:flex;align-items:center;gap:16px;
    margin-bottom:20px;opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
  body.at-data #databar{opacity:1;transform:none}
  #databar #dbquery{margin-left:auto;display:flex;align-items:center;gap:12px;padding:8px 14px;
    border-radius:12px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line)}
  #databar #dbquery label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
  #databar #dbquery input{width:74px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:8px 10px;font-size:14px;outline:none;font-family:inherit}
  #databar #dbquery input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,162,255,.18)}

  /* No inner scroll: the panel grows to fit its 25-row page, so the table moves
     with the single page scroll instead of trapping momentum in a nested area. */
  #panel{width:780px;max-width:calc(100vw - 40px);border-radius:16px;background:var(--panel);
    backdrop-filter:blur(18px);border:1px solid var(--line);overflow:hidden;
    box-shadow:0 20px 70px rgba(0,0,0,.6);display:flex;flex-direction:column;
    opacity:0;transform:translateY(40px);transition:opacity .6s ease,transform .6s ease}
  body.at-data #panel{opacity:1;transform:none}
  #phead{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
  #phead h2{margin:0;font-size:13px;font-weight:600;letter-spacing:2.5px;color:#fff;flex:1}
  #ptotal{font-size:12px;color:var(--muted)}
  #pbody{overflow:visible}
  table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  thead th{background:rgba(9,12,22,.97);color:var(--accent);
    text-transform:uppercase;letter-spacing:1px;font-size:10.5px;font-weight:600;
    padding:12px;text-align:right;cursor:pointer;user-select:none;white-space:nowrap}
  thead th:first-child{text-align:left}
  thead th:hover{color:#fff}
  tbody td{padding:9px 12px;text-align:right;border-top:1px solid rgba(150,180,220,.07);white-space:nowrap}
  tbody td:first-child{text-align:left;color:#cdd8ee;font-variant-numeric:normal}
  tbody tr:hover{background:rgba(122,162,255,.08)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;
    box-shadow:0 0 8px currentColor}
  #pager{display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted)}
  #pager button{cursor:pointer;border:1px solid var(--line);background:rgba(122,162,255,.08);
    color:var(--accent);border-radius:8px;padding:7px 15px;font-size:12px;font-weight:600;font-family:inherit;transition:.2s}
  #pager button:hover:not(:disabled){background:rgba(122,162,255,.2)}
  #pager button:disabled{opacity:.3;cursor:default}
  #pinfo{flex:1;text-align:center}
  #backup{cursor:pointer;background:none;border:1px solid var(--line);
    color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;
    padding:11px 20px;border-radius:10px;transition:.2s;white-space:nowrap}
  #backup:hover{color:var(--text);border-color:var(--accent)}

  /* tooltip */
  #tip{position:fixed;z-index:6;pointer-events:none;opacity:0;transition:opacity .15s;
    padding:11px 13px;border-radius:12px;background:rgba(6,10,20,.92);backdrop-filter:blur(8px);
    border:1px solid var(--line);font-size:12px;line-height:1.7;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:250px}
  #tip .sid{color:#fff;font-weight:600;font-size:12px}
  #tip .row{color:var(--muted)} #tip .row b{color:var(--text);font-weight:500}
  #tip .pct{font-weight:600}

  #veil{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 45%,#08101f,#04060c 70%);transition:opacity .8s}
  #veil .ring{width:52px;height:52px;border-radius:50%;border:2px solid rgba(122,162,255,.15);
    border-top-color:var(--accent);animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #veil.hide{opacity:0;pointer-events:none}
  #banner{position:fixed;top:0;left:0;right:0;z-index:8;padding:10px;text-align:center;
    background:rgba(70,24,24,.92);color:#ffd7d7;font-size:13px;display:none}

  /* Ambient CSS layers behind the WebGL scene: faint drifting nebula gas + slow
     comets. Pure hardware-accelerated transforms (translate3d/rotate) so they
     stay smooth and cheap, independent of the 3D render loop. */
  #ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
  .neb{position:absolute;border-radius:50%;filter:blur(30px);opacity:.16;will-change:transform;
    mix-blend-mode:screen}
  .neb.a{width:60vw;height:60vw;left:-10vw;top:-15vw;
    background:radial-gradient(circle,rgba(90,120,200,.5),transparent 62%);
    animation:driftA 68s ease-in-out infinite alternate}
  .neb.b{width:55vw;height:55vw;right:-12vw;top:20vh;
    background:radial-gradient(circle,rgba(200,120,90,.42),transparent 62%);
    animation:driftB 84s ease-in-out infinite alternate}
  .neb.c{width:48vw;height:48vw;left:25vw;bottom:-18vw;
    background:radial-gradient(circle,rgba(150,90,170,.4),transparent 62%);
    animation:driftC 96s ease-in-out infinite alternate}
  @keyframes driftA{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(6vw,4vh,0) rotate(40deg)}}
  @keyframes driftB{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(-7vw,-5vh,0) rotate(-35deg)}}
  @keyframes driftC{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(4vw,-6vh,0) rotate(30deg)}}

  .comet{position:fixed;top:0;left:0;width:3px;height:3px;border-radius:50%;
    background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.7);z-index:0;pointer-events:none;
    opacity:0;will-change:transform,opacity}
  .comet::after{content:"";position:absolute;right:3px;top:50%;transform:translateY(-50%);
    width:170px;height:2px;border-radius:2px;
    background:linear-gradient(270deg,rgba(180,205,255,.75),rgba(180,205,255,0))}
</style>
</head>
<body>
<div id="ambient">
  <div class="neb a"></div><div class="neb b"></div><div class="neb c"></div>
</div>
<div id="scene"></div>
<div id="banner"></div>

<div id="title">
  <h1>GAIA <b>ATLAS</b></h1>
  <p>A living map of stars whose brightness shifted across the mission. Each point is a real Gaia source, clustered by its full signature and coloured from cool blue to hot red by how much it varied.</p>
</div>

<div id="tip"></div>

<main>
  <section id="hero"></section>
  <section id="data">
    <div id="databar">
      <button id="backup" onclick="backToSky()">Back to the sky</button>
      <div id="dbquery">
        <label for="x2">Threshold X %</label>
        <input id="x2" type="number" value="20" min="0" step="1">
        <button class="btn" style="padding:9px 18px;font-size:12px" onclick="reveal(true)">Query</button>
      </div>
    </div>
    <div id="panel">
      <div id="phead">
        <h2>VARIABLE SOURCES</h2>
        <span id="ptotal"></span>
        <button id="pmin" class="btn" style="padding:7px 14px;font-size:11px" onclick="toggleMin()">Hide</button>
      </div>
      <div id="pbody">
        <table><thead><tr id="head"></tr></thead><tbody id="tbody"></tbody></table>
      </div>
      <div id="pager">
        <button id="prev" onclick="go(-1)">Prev</button>
        <span id="pinfo"></span>
        <button id="next" onclick="go(1)">Next</button>
      </div>
    </div>
  </section>
</main>

<div id="controls">
  <div id="status"></div>
  <div id="dock">
    <label for="x">Threshold X %</label>
    <input id="x" type="number" value="20" min="0" step="1">
    <button class="btn" id="go" onclick="reveal()">Reveal</button>
  </div>
  <div id="hint">drag to orbit&nbsp;&nbsp;/&nbsp;&nbsp;scroll to fly&nbsp;&nbsp;/&nbsp;&nbsp;hover a star for detail</div>
  <button id="reveal" onclick="document.getElementById('data').scrollIntoView({behavior:'smooth'})">
    Variable sources<span class="chev"></span>
  </button>
</div>

<div id="veil"><div class="ring"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const API = (window.GAIA_API || "/csp/gaia/api") + "/variations";
const GALAXY_N = 2000;
// Rows per page adapt to viewport height so the (now non-scrolling) panel fits
// on screen: subtract chrome (title bar, databar, header, pager, padding) and
// divide by row height, clamped to a sane range.
function computePageSize(){
  return Math.max(6, Math.min(20, Math.floor((innerHeight - 360) / 30)));
}
let PAGE_SIZE = computePageSize();
const COLS = ["source_id","ra","dec","mag_max","mag_min","pct_change"];
const LABELS = {source_id:"Source ID",ra:"RA",dec:"Dec",mag_max:"Mag max",mag_min:"Mag min",pct_change:"% change"};

// deterministic RNG so the cluster layout is stable across reloads
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

// ---- renderer / scene ----
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
// cap at 1.5: bloom allocates several full-res framebuffers, so fewer pixels =
// notably less GPU memory + fill cost, with little visible difference here
const PIXR=Math.min(devicePixelRatio,1.5);
renderer.setPixelRatio(PIXR);
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04060c, 0.0012);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 6000);
camera.position.set(0, 120, 360);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.25;
controls.minDistance = 20; controls.maxDistance = 1200;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.7, 0.5, 0.25);
composer.addPass(bloom);

function softTexture(){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)'); grd.addColorStop(.25,'rgba(255,255,255,.5)');
  grd.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=grd; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const SOFT = softTexture();

// Pillars-of-Creation inspired gas palette
const NEB = [0x3a5a8c,0x8c5a2b,0xc99b5a,0x2e6d63,0x9c5566,0x6a4a8c,0xb8825a,0x40708f];

// ---- ambient starfield (kept: looks great) ----
(function starfield(){
  const n=2800, pos=new Float32Array(n*3), col=new Float32Array(n*3), c=new THREE.Color();
  for(let i=0;i<n;i++){
    const r=600+Math.random()*2000, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph); pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    const h=Math.random(); c.setHSL(h<.5?0.6:0.06, 0.35, 0.55+Math.random()*0.3);  // blue & warm whites
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.7,map:SOFT,vertexColors:true,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.7,sizeAttenuation:true})));
})();

// ---- ambient far background gas so the void isn't pure black ----
(function backgroundGas(){
  const rng=mulberry32(99);
  for(let i=0;i<7;i++){
    const hex=NEB[i%NEB.length];
    const m=new THREE.SpriteMaterial({map:SOFT,color:hex,transparent:true,opacity:.05,
      depthWrite:false,blending:THREE.AdditiveBlending});
    const sp=new THREE.Sprite(m);
    const r=700+rng()*900, th=rng()*Math.PI*2, ph=Math.acos(2*rng()-1);
    sp.position.set(r*Math.sin(ph)*Math.cos(th), r*Math.cos(ph), r*Math.sin(ph)*Math.sin(th));
    const s=600+rng()*700; sp.scale.set(s,s,1); scene.add(sp);
  }
})();

// ---- drifting dust motes ----
const spores=(()=>{
  const n=350, pos=new Float32Array(n*3), col=new Float32Array(n*3), vel=[], c=new THREE.Color();
  for(let i=0;i<n;i++){
    const r=80+Math.random()*300, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=r*Math.cos(ph)*.6; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
    vel.push((Math.random()-.5)*.04,(Math.random()-.3)*.03,(Math.random()-.5)*.04);
    c.setHSL(0.06+Math.random()*0.08,0.5,0.6); col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({size:3.5,map:SOFT,vertexColors:true,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.5}));
  p.userData.vel=vel; scene.add(p); return p;
})();

// ---- % change -> colour. Mapped across the CURRENT result range (set by
// setColorRange) so the palette always spans its full width instead of bunching.
// Ramp is a Pillars-of-Creation-style multi-stop: cyan-blue -> teal -> gold ->
// rust -> rose-red as variation climbs. ----
let COLOR_LO=0, COLOR_HI=100;
function setColorRange(vals){
  if(!vals.length) return;
  const s=[...vals].sort((a,b)=>a-b);
  COLOR_LO=s[Math.floor(s.length*0.02)];      // robust 2nd/98th percentiles
  COLOR_HI=s[Math.floor(s.length*0.98)];
  if(COLOR_HI-COLOR_LO<1e-6) COLOR_HI=COLOR_LO+1;
}
const RAMP=[ // [t, h, s, l], h in [0,1]
  [0.00, 0.55, 0.75, 0.55],  // cyan-blue
  [0.30, 0.50, 0.60, 0.55],  // teal
  [0.55, 0.12, 0.80, 0.60],  // gold
  [0.78, 0.06, 0.85, 0.55],  // rust/amber
  [1.00, 0.98, 0.80, 0.55],  // rose-red
];
function pctColor(pct){
  let t=(pct-COLOR_LO)/(COLOR_HI-COLOR_LO); t=Math.min(Math.max(t,0),1);
  let a=RAMP[0], b=RAMP[RAMP.length-1];
  for(let i=0;i<RAMP.length-1;i++){ if(t>=RAMP[i][0]&&t<=RAMP[i+1][0]){a=RAMP[i];b=RAMP[i+1];break;} }
  const f=(t-a[0])/((b[0]-a[0])||1);
  // interpolate hue the short way
  let h0=a[1],h1=b[1]; if(Math.abs(h1-h0)>0.5){if(h1>h0)h0+=1;else h1+=1;}
  const c=new THREE.Color();
  c.setHSL(((h0+(h1-h0)*f)%1+1)%1, a[2]+(b[2]-a[2])*f, a[3]+(b[3]-a[3])*f);
  return c;
}

// ---- data-driven star field: cluster sources by their 5D signature ----
let starPoints=null, starData=[], nebulaGroup=new THREE.Group();
scene.add(nebulaGroup);

const starMat = new THREE.ShaderMaterial({
  uniforms:{ uProg:{value:0}, uPixelRatio:{value:PIXR}, uTex:{value:SOFT}, uTime:{value:0} },
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  vertexShader:`
    uniform float uProg; uniform float uPixelRatio; uniform float uTime;
    attribute float aSize; attribute vec3 aColor; attribute float aDelay; attribute vec3 aHome;
    attribute float aTwinkle;   // 0 = steady; >0 = phase offset for pulsing constellations
    varying vec3 vColor; varying float vE; varying float vTw;
    void main(){
      vColor=aColor;
      float e=clamp((uProg-aDelay)/0.28,0.0,1.0);
      e=1.0-pow(1.0-e,3.0);
      vE=e;
      // gentle irregular pulse: two detuned sines so it never repeats cleanly
      float tw = aTwinkle>0.0
        ? 0.72 + 0.28*(0.6*sin(uTime*1.7+aTwinkle)+0.4*sin(uTime*0.9+aTwinkle*2.3))
        : 1.0;
      vTw = tw;
      vec3 p=aHome*e;
      vec4 mv=modelViewMatrix*vec4(p,1.0);
      gl_PointSize=aSize*uPixelRatio*(300.0/-mv.z)*(0.2+0.8*e)*(0.85+0.15*tw);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader:`
    uniform sampler2D uTex; varying vec3 vColor; varying float vE; varying float vTw;
    void main(){
      vec4 t=texture2D(uTex,gl_PointCoord);
      if(t.a<0.02) discard;
      vec3 c=vColor*(1.1+0.65*vE)+vec3(0.16)*pow(t.a,3.0);
      gl_FragColor=vec4(c*vTw, t.a*vE);   // twinkle modulates brightness
    }`
});
let explodeStart=0;

function buildGalaxy(data){
  if(starPoints){scene.remove(starPoints);starPoints.geometry.dispose();}
  nebulaGroup.clear();
  starData=data;
  const n=data.length;
  setColorRange(data.map(d=>+d.pct_change));   // palette spans this result set
  // 1) normalise the 5D feature vector [ra,dec,mag_max,mag_min,pct]
  const F=data.map(d=>[+d.ra,+d.dec,+d.mag_max,+d.mag_min,+d.pct_change]);
  const mn=[1e9,1e9,1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9,-1e9,-1e9];
  for(const f of F) for(let k=0;k<5;k++){mn[k]=Math.min(mn[k],f[k]);mx[k]=Math.max(mx[k],f[k]);}
  const norm=F.map(f=>f.map((v,k)=>{const d=mx[k]-mn[k];return d>1e-9?(v-mn[k])/d:0.5;}));

  // 2) attractors: pseudo-random anchors in both 5D feature space and 3D world
  const rng=mulberry32(1337), K=16, att=[];
  for(let k=0;k<K;k++){
    const feat=[rng(),rng(),rng(),rng(),rng()];
    const r=90+rng()*150, th=rng()*Math.PI*2, ph=Math.acos(2*rng()-1);
    att.push({feat, pos:[r*Math.sin(ph)*Math.cos(th), (rng()-0.5)*120, r*Math.sin(ph)*Math.sin(th)],
      spread:26+rng()*26, count:0, hex:NEB[k%NEB.length], cx:0,cy:0,cz:0});
  }
  // fixed 5x3 projection for intra-cluster residual placement
  const P=[]; for(let i=0;i<15;i++)P.push(rng()*2-1);

  // pick ~4 clusters to be "twinkling constellations" (gentle irregular pulse)
  const twinkleClusters=new Set();
  while(twinkleClusters.size<Math.min(4,K)) twinkleClusters.add(Math.floor(rng()*K));

  const pos=new Float32Array(n*3), col=new Float32Array(n*3), size=new Float32Array(n),
        delay=new Float32Array(n), twk=new Float32Array(n);
  for(let i=0;i<n;i++){
    const f=norm[i];
    // nearest attractor in feature space -> vector quantization = clusters
    let best=0,bd=1e9;
    for(let k=0;k<K;k++){let s=0;for(let j=0;j<5;j++){const dd=f[j]-att[k].feat[j];s+=dd*dd;} if(s<bd){bd=s;best=k;}}
    const a=att[best];
    const res=[f[0]-a.feat[0],f[1]-a.feat[1],f[2]-a.feat[2],f[3]-a.feat[3],f[4]-a.feat[4]];
    const ox=(res[0]*P[0]+res[1]*P[1]+res[2]*P[2]+res[3]*P[3]+res[4]*P[4]);
    const oy=(res[0]*P[5]+res[1]*P[6]+res[2]*P[7]+res[3]*P[8]+res[4]*P[9]);
    const oz=(res[0]*P[10]+res[1]*P[11]+res[2]*P[12]+res[3]*P[13]+res[4]*P[14]);
    const jx=(rng()-.5), jy=(rng()-.5), jz=(rng()-.5);
    const x=a.pos[0]+ox*a.spread*2.2+jx*a.spread;
    const y=a.pos[1]+oy*a.spread*2.2+jy*a.spread;
    const z=a.pos[2]+oz*a.spread*2.2+jz*a.spread;
    pos[i*3]=x; pos[i*3+1]=y; pos[i*3+2]=z;
    a.count++; a.cx+=x; a.cy+=y; a.cz+=z;
    const pct=+data[i].pct_change, mag=+data[i].mag_min;
    const c=pctColor(pct); col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
    size[i]=7+Math.max(0,(20-mag))*2.0+pct*0.08;
    delay[i]=0.72*(i/n)+rng()*0.18;   // brightest/most-variable ignite first, in waves
    twk[i]=twinkleClusters.has(best) ? (0.3+rng()*6.0) : 0.0;  // per-star phase, or steady
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('aHome',new THREE.BufferAttribute(pos,3));
  g.setAttribute('position',new THREE.BufferAttribute(pos.slice(),3)); // for raycasting
  g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  g.setAttribute('aDelay',new THREE.BufferAttribute(delay,1));
  g.setAttribute('aTwinkle',new THREE.BufferAttribute(twk,1));
  starPoints=new THREE.Points(g,starMat); starPoints.frustumCulled=false;
  scene.add(starPoints);

  // 3) nebula clouds on real cluster centroids (fade as you fly through them)
  clusterCentroids=[];
  att.forEach(a=>{
    if(a.count<12) return;
    const cx=a.cx/a.count, cy=a.cy/a.count, cz=a.cz/a.count;
    clusterCentroids.push([cx,cy,cz]);
    for(let l=0;l<3;l++){
      const m=new THREE.SpriteMaterial({map:SOFT,color:a.hex,transparent:true,opacity:0,
        depthWrite:false,blending:THREE.AdditiveBlending});
      const sp=new THREE.Sprite(m);
      sp.position.set(cx+(rng()-.5)*30, cy+(rng()-.5)*30, cz+(rng()-.5)*30);
      const s=a.spread*(5+l*2.5); sp.scale.set(s,s,1);
      sp.userData.base=0.20-l*0.045;
      nebulaGroup.add(sp);
    }
  });

  starMat.uniforms.uProg.value=0; explodeStart=performance.now();
}

let clusterCentroids=[];   // cluster centres (kept for potential future ambient use)

// ---- hover picking ----
const ray=new THREE.Raycaster(); ray.params.Points.threshold=4;
const mouse=new THREE.Vector2(); let hoverIdx=-1;
const tip=document.getElementById('tip');
addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  tip.style.left=(e.clientX+16)+'px'; tip.style.top=(e.clientY+16)+'px';
  pickDirty=true;                       // only raycast after the mouse actually moves
});
function pick(){
  if(!starPoints||starMat.uniforms.uProg.value<0.9||scrollY>innerHeight*0.4){tip.style.opacity=0;return;}
  ray.setFromCamera(mouse,camera);
  const hit=ray.intersectObject(starPoints);
  if(hit.length){
    const i=hit[0].index;
    if(i!==hoverIdx){
      hoverIdx=i; const d=starData[i]; const col=pctColor(+d.pct_change).getStyle();
      tip.innerHTML=`<div class="sid">${d.source_id}</div>
        <div class="row">RA <b>${(+d.ra).toFixed(4)}</b> / Dec <b>${(+d.dec).toFixed(4)}</b></div>
        <div class="row">mag <b>${(+d.mag_min).toFixed(2)}</b> to <b>${(+d.mag_max).toFixed(2)}</b></div>
        <div class="row">variation <span class="pct" style="color:${col}">${(+d.pct_change).toFixed(2)}%</span></div>`;
    }
    tip.style.opacity=1;
  } else {hoverIdx=-1; tip.style.opacity=0;}
}

// ---- animate ----
// Render only when the galaxy is actually on screen and the tab is visible. When
// hidden or scrolled into the data view, we stop the loop entirely (no WebGL /
// bloom work) and resume on demand — the main CPU/GPU/RAM saver.
const clock=new THREE.Clock();
let running=false, frame=0, pickDirty=false;
function galaxyVisible(){ return !document.hidden && scrollY < innerHeight*0.9; }
function loop(){
  if(!galaxyVisible()){ running=false; return; }   // stop; startLoop() revives it
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  frame++;
  if(frame&1){                                       // spores every other frame
    const p=spores.geometry.attributes.position, v=spores.userData.vel;
    for(let i=0;i<p.count;i++){
      p.array[i*3]+=v[i*3]; p.array[i*3+1]+=v[i*3+1]; p.array[i*3+2]+=v[i*3+2];
      if(Math.abs(p.array[i*3+1])>220)v[i*3+1]*=-1;
    }
    p.needsUpdate=true;
  }
  nebulaGroup.children.forEach(sp=>{
    const dist=camera.position.distanceTo(sp.position);
    const k=Math.min(Math.max((dist-35)/150,0),1);
    sp.material.opacity=sp.userData.base*k;
  });
  if(explodeStart){
    starMat.uniforms.uProg.value=Math.min((performance.now()-explodeStart)/3000,1);
    if(starPoints) starPoints.rotation.y+=dt*0.015;
  }
  starMat.uniforms.uTime.value=clock.elapsedTime;   // drives the twinkle pulse
  nebulaGroup.rotation.y+=dt*0.01;
  controls.update();
  if(pickDirty){ pick(); pickDirty=false; }          // raycast only after mouse move
  composer.render();
}
function startLoop(){ if(!running){ running=true; clock.getDelta(); requestAnimationFrame(loop); } }
document.addEventListener('visibilitychange',()=>{ if(galaxyVisible()) startLoop(); });
startLoop();
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});

// ---- data / table ----
const $=id=>document.getElementById(id);
let page=1,total=0,tableRows=[],sortCol=null,asc=false;
const pages=()=>Math.max(1,Math.ceil(total/PAGE_SIZE));
async function fetchPage(x,pg,size,withCount=true){
  const r=await fetch(`${API}?x=${encodeURIComponent(x)}&page=${pg}&pageSize=${size}&count=${withCount?1:0}`);
  if(!r.ok) throw new Error(`HTTP ${r.status}`); return r.json();
}
function renderTable(){
  $('head').innerHTML=COLS.map(c=>`<th onclick="sortBy('${c}')">${LABELS[c]}</th>`).join('');
  let rows=tableRows;
  if(sortCol) rows=[...rows].sort((a,b)=>{const v=(parseFloat(a[sortCol])-parseFloat(b[sortCol]))||(''+a[sortCol]).localeCompare(''+b[sortCol]);return asc?v:-v;});
  $('tbody').innerHTML=rows.map(o=>{const col=pctColor(+o.pct_change).getStyle();
    return `<tr><td><span class="dot" style="color:${col}"></span>${o.source_id}</td>`+
      `<td>${(+o.ra).toFixed(4)}</td><td>${(+o.dec).toFixed(4)}</td>`+
      `<td>${(+o.mag_max).toFixed(3)}</td><td>${(+o.mag_min).toFixed(3)}</td>`+
      `<td style="color:${col};font-weight:600">${(+o.pct_change).toFixed(2)}</td></tr>`;}).join('');
  $('pinfo').textContent=`Page ${page} / ${pages()}`;
  $('ptotal').textContent=total?`${total.toLocaleString()} sources`:'';
  $('prev').disabled=page<=1; $('next').disabled=page>=pages();
}
let curX=20;
window.sortBy=c=>{asc=(c===sortCol)?!asc:false;sortCol=c;renderTable();};
window.go=async d=>{const nn=page+d;if(nn<1||nn>pages())return;page=nn;
  try{const j=await fetchPage(curX,page,PAGE_SIZE,false);tableRows=j.rows;sortCol=null;renderTable();}
  catch(e){setStatus('Error: '+e.message,true);}};
function setStatus(t,err){const s=$('status');s.textContent=t;s.className=err?'err':'';}

// Re-fit rows per page when the window resizes (debounced). Refetch the current
// page at the new size and re-anchor to keep the top row roughly stable.
let resizeTimer=null;
addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(async()=>{
    const ns=computePageSize();
    if(ns===PAGE_SIZE) return;
    const firstRow=(page-1)*PAGE_SIZE;      // keep the same starting row visible
    PAGE_SIZE=ns;
    page=Math.floor(firstRow/PAGE_SIZE)+1;
    try{const j=await fetchPage(curX,page,PAGE_SIZE,false);tableRows=j.rows;sortCol=null;renderTable();}
    catch(e){setStatus('Error: '+e.message,true);}
  },250);
});

let statusTimer=null;
window.reveal=async(fromData)=>{
  const x=(fromData?$('x2'):$('x')).value;
  $('x').value=x; $('x2').value=x; curX=x;      // keep both inputs in sync
  clearTimeout(statusTimer); setStatus('scanning the sky ...');
  try{
    // First call warms the server-side cache; after that every query is instant.
    // We fetch the galaxy sample + the first table page together, then the shader
    // staggers the stars so they pop into existence in waves over ~2.5s.
    const [galaxy,tablePage]=await Promise.all([
      fetchPage(x,1,GALAXY_N,true), fetchPage(x,1,PAGE_SIZE,false)]);
    total=galaxy.total; page=1; tableRows=tablePage.rows; sortCol=null;
    buildGalaxy(galaxy.rows); renderTable();
    setStatus(`${total.toLocaleString()} sources found`);
    statusTimer=setTimeout(()=>setStatus(''),2600);
  }catch(e){setStatus('Error: '+e.message,true);}
};

window.backToSky=()=>window.scrollTo({top:0,behavior:'smooth'});

// Retract the fixed hero UI (title + controls) once the viewer scrolls toward
// the data section, so nothing overlaps the panel. Threshold ~35% of a screen.
function onScroll(){
  document.body.classList.toggle('at-data', scrollY > innerHeight*0.35);
  if(galaxyVisible()) startLoop();     // resume rendering when the sky is back in view
}
addEventListener('scroll', onScroll, {passive:true});
onScroll();
window.toggleMin=()=>{const b=$('pbody'),g=$('pager'),btn=$('pmin');
  const hidden=b.style.display==='none';
  b.style.display=hidden?'':'none'; g.style.display=hidden?'':'none';
  btn.textContent=hidden?'Hide':'Show';};

function ready(){$('veil').classList.add('hide');setTimeout(()=>$('veil').style.display='none',900);reveal();}
if(document.readyState!=='loading')ready(); else addEventListener('DOMContentLoaded',ready);
window.__galaxyReady=true;

// ---- slow comets: a single reused element drifts across on a random vector with
// a fading dust tail, then waits a random interval. CSS transforms only. ----
(function comets(){
  const el=document.createElement('div'); el.className='comet'; document.body.appendChild(el);
  function fly(){
    if(document.hidden){ setTimeout(fly, 4000); return; }
    const W=innerWidth,H=innerHeight;
    // random entry on the top or left edge, general heading down-and-across
    const fromLeft=Math.random()<0.5;
    const sx=fromLeft?-200:Math.random()*W*0.6, sy=fromLeft?Math.random()*H*0.5:-160;
    const ang=(15+Math.random()*40)*Math.PI/180;
    const dist=Math.hypot(W,H)+400;
    const ex=sx+Math.cos(ang)*dist, ey=sy+Math.sin(ang)*dist;
    // quadratic Bezier control point pushed perpendicular to the chord so the
    // path bows into a gentle arc (random side + curvature)
    const mx=(sx+ex)/2, my=(sy+ey)/2;
    const nx=-Math.sin(ang), ny=Math.cos(ang);
    const bow=(Math.random()<0.5?-1:1)*(dist*(0.10+Math.random()*0.14));
    const cx=mx+nx*bow, cy=my+ny*bow;
    const dur=5200+Math.random()*4200;                    // slow: 5-9.4s
    // sample the curve into keyframes; rotate the tail along the local tangent
    const N=16, frames=[];
    let px=sx, py=sy;
    for(let i=0;i<=N;i++){
      const t=i/N, u=1-t;
      const x=u*u*sx+2*u*t*cx+t*t*ex;
      const y=u*u*sy+2*u*t*cy+t*t*ey;
      const deg=Math.atan2(y-py,x-px)*180/Math.PI; px=x; py=y;
      let op=0.9; if(t<0.12) op=t/0.12*0.9; else if(t>0.85) op=(1-t)/0.15*0.9;
      frames.push({offset:t, opacity:op, transform:`translate3d(${x}px,${y}px,0) rotate(${deg}deg)`});
    }
    frames[0].opacity=0; frames[N].opacity=0;
    el.style.transform=frames[0].transform;
    el.animate(frames,{duration:dur, easing:'linear'});
    setTimeout(fly, dur + 9000 + Math.random()*22000);    // infrequent gaps
  }
  setTimeout(fly, 6000 + Math.random()*8000);
})();
</script>
<script>
setTimeout(()=>{if(!window.__galaxyReady){const b=document.getElementById('banner');
  b.style.display='block';b.textContent='3D engine could not load (offline?). Scroll down for the data table.';}},9000);
</script>
