name: RunChallenge

# Runs the headless pipeline end-to-end on a TINY committed sample, against the
# PUBLIC Community Edition IRIS image — so it passes unattended on a stock runner.
#
# Notes:
#   * The real Gaia dataset (~800 MB, 20 files) is gitignored and user-provided,
#     so CI runs the same pipeline against tests/fixtures/ with GAIA_NFILES=1.
#   * The primary docker-compose.yml uses the LICENSED image
#     containers.intersystems.com/intersystems/iris:latest-cd (registry auth +
#     license required). CI instead uses docker-compose.ci.yml (Community
#     Edition, no license) via COMPOSE_FILE, which RunChallenge picks up
#     natively. The local/production experience is unchanged.

on: [push, workflow_dispatch]

# RunChallenge reads COMPOSE_FILE through `docker compose`, so this single env
# var swaps the whole stack to the no-license Community Edition for every step.
env:
  COMPOSE_FILE: docker-compose.ci.yml

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: pip install intersystems-irispython pytest

      # Run the unmodified challenge entrypoint against the committed fixture.
      # GAIA_NFILES=1 -> only the single sample file is needed; X=0 ensures the
      # 500-row sample yields rows so the shape check has something to validate.
      # RunChallenge brings the container up, waits for health, and runs itself.
      - name: Run challenge on the sample fixture
        run: X=0 GAIA_NFILES=1 DATA=tests/fixtures ./RunChallenge > out.csv

      - name: Validate CSV shape (exactly 6 comma-separated fields per line)
        run: |
          test -s out.csv || { echo "no rows produced" >&2; exit 1; }
          awk -F, 'NF!=6{print "bad line "NR": "$0 > "/dev/stderr"; exit 1}' out.csv
          echo "$(wc -l < out.csv) rows, all 6 fields"

      # The container is already up from the previous step; run the full suite
      # (pure unit tests + the live-IRIS integration parity test).
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
